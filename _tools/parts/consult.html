<div data-onvi-consult="" id="consultFab" hidden style="position:fixed; right:28px; bottom:28px; z-index:500;">
  <button type="button" id="consultOpen" aria-label="무료 상담 신청" style="display:inline-flex; align-items:center; justify-content:center; gap:9px; height:56px; padding:0 26px; border-radius:999px; background:linear-gradient(120deg, #5FD3B4 0%, #86E3C4 42%, #FFD79A 100%); color:#12332B; border:1px solid rgba(255,255,255,0.55); cursor:pointer; box-shadow:0 18px 40px -14px rgba(79,184,158,0.7), inset 0 1px 0 rgba(255,255,255,0.45); animation:onviConsultIn .45s cubic-bezier(.22,.61,.36,1); transition:box-shadow .25s, transform .25s, filter .25s;" style-hover="transform:translateY(-2px); filter:saturate(1.12); box-shadow:0 26px 50px -14px rgba(79,184,158,0.78), inset 0 1px 0 rgba(255,255,255,0.55);">
    <span data-pc-only="" aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:999px; background:#FFFFFF; color:#2A7360; font-size:12px; line-height:1; box-shadow:0 2px 6px rgba(18,51,43,0.18);"><svg viewBox="0 0 24 24" width="13" height="13" fill="#E8749B" aria-hidden="true"><path d="M12 20.5 C6.5 16.8 3.5 13.6 3.5 10.2 3.5 7.6 5.5 5.8 7.9 5.8 c1.6 0 3.1 0.8 4.1 2.2 1-1.4 2.5-2.2 4.1-2.2 2.4 0 4.4 1.8 4.4 4.4 0 3.4-3 6.6-8.5 10.3 z"></path></svg></span>
    <span data-pc-only="" style="font-size:15px; font-weight:700; letter-spacing:-0.01em; line-height:1.2; color:#FFFFFF; text-shadow:0 1px 6px rgba(18,51,43,0.35);">무료 상담 신청</span>
    <span data-m-only="" style="font-size:13.5px; font-weight:700; letter-spacing:-0.01em; line-height:1.2;">상담</span>
    <span data-m-only="" aria-hidden="true" style="font-size:10px; opacity:0.85; line-height:1;">무료</span>
  </button>
</div>
<div data-onvi-modal="" id="consultModal" hidden role="dialog" aria-modal="true" aria-label="무료 상담 신청" style="position:fixed; inset:0; z-index:600; display:flex; align-items:center; justify-content:center; padding:16px;">
  <div id="consultBackdrop" style="position:absolute; inset:0; background:rgba(31,42,58,0.45); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); animation:onviFadeIn .25s ease;"></div>
  <div style="position:relative; width:min(420px, 100%); max-height:calc(100vh - 48px); overflow-y:auto; background:#FFFFFF; border-radius:24px; padding:30px 28px; box-shadow:0 40px 90px -30px rgba(31,42,58,0.55); animation:onviModalIn .3s cubic-bezier(.22,.61,.36,1);">
    <button type="button" class="consult-close" aria-label="닫기" style="position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:999px; background:#FBF8EF; color:#6A7789; border:1px solid #E6E0D1; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; padding:0;" style-hover="color:var(--simya); border-color:#D5CDB9;">✕</button>

    <div id="consultFormWrap">
      <div style="font-size:11.5px; font-weight:700; letter-spacing:0.14em; color:#2A7360; margin-bottom:12px;">무료 상담</div>
      <h2 style="font-size:21px; font-weight:700; letter-spacing:-0.025em; line-height:1.4; margin:0 0 8px; color:var(--simya); text-wrap:balance;">가족에게 맞는 방법, <br>함께 찾아드려요.</h2>
      <p style="font-size:13.5px; line-height:1.6; color:#3F4D62; margin:0 0 22px;">성함과 연락처만 남겨주시면 온비가 먼저 연락드려요.</p>
      <form id="consultForm" novalidate style="display:flex; flex-direction:column; gap:14px;">
        <div>
          <label for="cb-name" style="display:block; font-size:13px; font-weight:700; color:var(--simya); margin-bottom:7px;">성함<span style="color:#2A7360; margin-left:3px;">*</span></label>
          <input id="cb-name" name="name" type="text" placeholder="예) 김온비" style="width:100%; background:#FBF8EF; border:1px solid #E6E0D1; border-radius:12px; padding:12px 14px; font-family:inherit; font-size:14.5px; color:var(--simya); transition:border-color .2s, box-shadow .2s, background .2s;">
        </div>
        <div>
          <label for="cb-phone" style="display:block; font-size:13px; font-weight:700; color:var(--simya); margin-bottom:7px;">연락처<span style="color:#2A7360; margin-left:3px;">*</span></label>
          <input id="cb-phone" name="phone" type="text" inputmode="tel" placeholder="예) 010-1234-5678" style="width:100%; background:#FBF8EF; border:1px solid #E6E0D1; border-radius:12px; padding:12px 14px; font-family:inherit; font-size:14.5px; color:var(--simya); transition:border-color .2s, box-shadow .2s, background .2s;">
        </div>
        <div style="display:flex; align-items:flex-start; gap:9px; padding:12px 14px; background:#FBF8EF; border:1px solid #E6E0D1; border-radius:12px;">
          <input id="cb-agree" name="agree" type="checkbox" style="width:18px; height:18px; margin:1px 0 0; accent-color:#4FB89E; flex-shrink:0; cursor:pointer;">
          <label for="cb-agree" style="font-size:12.5px; color:#3F4D62; line-height:1.55; cursor:pointer;">개인정보 수집·이용에 동의합니다. 상담 안내 목적으로만 사용 후 파기됩니다. <span style="color:#2A7360; font-weight:700;">(필수)</span></label>
        </div>
        <p id="consultError" hidden style="margin:0; font-size:13px; font-weight:600; color:var(--simhae);"></p>
        <button type="submit" style="width:100%; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 24px; border-radius:999px; background:var(--cheongja); color:#FFFFFF; font-size:15px; font-weight:700; letter-spacing:-0.01em; border:none; cursor:pointer; font-family:inherit; min-height:44px; transition:background .2s, box-shadow .2s;" style-hover="background:var(--action-primary-hover); box-shadow:0 12px 28px -12px rgba(79,184,158,0.7);">상담 신청하기 →</button>
      </form>
      <p style="font-size:12px; color:#6A7789; margin:14px 0 0; line-height:1.55; text-align:center;">더 자세히 적고 싶다면 <a href="contact.html" style="color:#2A7360; font-weight:600;">상담 신청 페이지</a>를 이용하세요.</p>
    </div>

    <div id="consultSent" hidden style="text-align:center; padding:14px 0 6px;">
      <div style="width:52px; height:52px; border-radius:999px; background:var(--saebyeok); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:22px; color:#2A7360;">✓</div>
      <h2 style="font-size:20px; font-weight:700; letter-spacing:-0.025em; margin:0 0 10px; color:var(--simya);">신청이 접수되었어요.</h2>
      <p style="font-size:14px; line-height:1.65; color:#3F4D62; margin:0 0 24px;"><span id="consultSentName"></span> 님, 평일 09:00–18:00 사이에 <br data-keep="">남겨주신 번호로 온비가 먼저 연락드립니다.</p>
      <button type="button" class="consult-close" style="display:inline-flex; align-items:center; justify-content:center; padding:12px 28px; border-radius:999px; background:var(--cheongja); color:#FFFFFF; font-size:14.5px; font-weight:700; border:none; cursor:pointer; font-family:inherit; min-height:44px; transition:background .2s;" style-hover="background:var(--action-primary-hover);">확인</button>
    </div>
  </div>
</div>
